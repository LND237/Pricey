version: '3'

vars:
  GO_MODULE: github.com/LND237/Pricey/src/core
  GO_DIR: src/core
  PY_DIR: src/scraper

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  setup:
    desc: Bootstrap the dev environment (Go module, Python venv).
    cmds:
      - task: setup:go-mod
      - task: setup:py-venv

  setup:go-mod:
    desc: Initialize the Go module in {{.GO_DIR}} if missing, then download deps.
    dir: '{{.GO_DIR}}'
    cmds:
      - test -f go.mod || go mod init {{.GO_MODULE}}
      - go mod tidy

  setup:py-venv:
    desc: Create the scraper's Python venv and install dependencies.
    dir: '{{.PY_DIR}}'
    cmds:
      - python3 -m venv .venv
      - ./.venv/bin/pip install --upgrade pip
      - '[ -f requirements.txt ] && ./.venv/bin/pip install -r requirements.txt || true'
    status:
      - test -x .venv/bin/python
    
  scraper:run:
      desc: Run the Project
      dir: '{{.PY_DIR}}'
      cmds:
        - ./.venv/bin/python main.py
    
  go:run:
      desc: Run the Go application
      dir: '{{.GO_DIR}}'
      cmds:
        - go run index.go
  expo:run:
      desc: Run the Expo application
      dir: 'src/expo'
      cmds:
        - npm run web
        
  run:
      desc: Run the entire project (Go, Python, and Expo).
      deps: [go:run, scraper:run, expo:run]